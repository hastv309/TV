<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>معرض خلفيات الشاشة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#0d1117;--card:#161b22;--ink:#f5f1ea;--soft:#a9b1bb;--accent:#ffd29a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
h1{font-size:22px;margin:0 0 4px}
.intro{color:var(--soft);font-size:14px;margin:0 0 22px;line-height:1.6}
section{margin-bottom:30px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{background:var(--accent);color:#1a1a1a;font-weight:700;border-radius:8px;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
h2{font-size:19px;margin:0}
.count{margin-inline-start:auto;color:var(--soft);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
figure{margin:0}
figure img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:var(--card)}
figcaption{font-size:11px;color:var(--soft);margin-top:3px;direction:ltr;text-align:right}
</style>
</head>
<body>
<h1>اختر مجموعة الخلفيات</h1>
<p class="intro">صور من Unsplash بدقة 4K، مقصوصة على مقاس الشاشة 16:9. قول لي رقم المجموعة أو أكثر من رقم.</p>
<div id="list"></div>
<script>
/* Photo collections (Unsplash, free licence). Each entry: [image id, photographer] */
var COLLECTIONS={
 lakes:{ar:"جبال وبحيرات",photos:[
  ["1501785888041-af3ef285b470","Pietro De Grandi"],["1480497490787-505ec076689f","Tim Stief"],
  ["1465056836041-7f43ac27dcb5","Tobias Keller"],["1493246507139-91e8fad9978e","garrett parker"],
  ["1501786223405-6d024d7c3b8d","Pietro De Grandi"],["1615729947596-a598e5de0ab3","Daniela Kokina"],
  ["1483004590101-e3dca99dac40","Jerry Kavan"],["1500964757637-c85e8a162699","simon"]]},
 peaks:{ar:"قمم وضباب",photos:[
  ["1506905925346-21bda4d32df4","Sam Ferrara"],["1540979388789-6cee28a1cdc9","Boris Baldinger"],
  ["1477346611705-65d1883cee1e","JOHN TOWNER"],["1511884642898-4c92249e20b6","pine watt"],
  ["1554629947-334ff61d85dc","Mads Schmidt Rasmussen"],["1534067783941-51c9c23ecefd","Guillaume Briard"],
  ["1707971321941-ff368cd1e944","Kim Chan"]]},
 golden:{ar:"غروب وساعة ذهبية",photos:[
  ["1494935362342-566c6d6e75b5","Cristina Gottardi"],["1466854076813-4aa9ac0fc347","Štefan Štefančík"],
  ["1641821078853-ababf7abd44e","Maddy Weiss"],["1642735107889-cd38ca625fbc","Mark Koch"],
  ["1782829566203-b30884338029","Portia Weiss"],["1431794062232-2a99a5431c6c","Wil Stewart"]]},
 night:{ar:"ليل ونجوم",photos:[
  ["1485470733090-0aae1788d5af","Daniel Leone"],["1504288145234-919e7bbc6d19","Patrick Fore"],
  ["1711708700663-4c35102fc4b8","Debashis RC Biswas"],["1428094479093-8973a318bd76","FORREST CAVALE"]]},
 coast:{ar:"سواحل وصحاري",photos:[
  ["1511300636408-a63a89df3482","Luca Micheli"],["1502085671122-2d218cd434e6","Michael"],
  ["1464254786740-b97e5420c299","Christian Joudrey"],["1637956254750-641851c59fa4","Bernd Dittrich"],
  ["1686012216030-aa93a1283560","Rebecca Calderon"]]},
 meadows:{ar:"مروج خضراء",photos:[
  ["1610552050890-fe99536c2615","lucas wesney"]]}};
var SET_ORDER=["lakes","peaks","golden","night","coast","meadows"];
function unsplashURL(id,w,h,q){return"https://images.unsplash.com/photo-"+id+"?w="+w+"&h="+h+"&fit=crop&crop=entropy&q="+q+"&fm=jpg"}

var list=document.getElementById("list");
SET_ORDER.forEach(function(key,i){
  var set=COLLECTIONS[key],sec=document.createElement("section");
  sec.innerHTML='<div class="head"><span class="num">'+(i+1)+'</span><h2>'+set.ar+'</h2><span class="count">'+set.photos.length+' صور</span></div><div class="grid"></div>';
  var grid=sec.querySelector(".grid");
  set.photos.forEach(function(p){
    var f=document.createElement("figure"),im=new Image();
    im.loading="lazy";im.alt="";im.src=unsplashURL(p[0],640,360,70);
    im.onerror=function(){f.remove()};
    var c=document.createElement("figcaption");c.textContent=p[1];
    f.appendChild(im);f.appendChild(c);grid.appendChild(f)});
  list.appendChild(sec)});
</script>
</body>
</html>

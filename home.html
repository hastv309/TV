<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Layout: 1920x1080 TV canvas. Clock block top-left, icon buttons top-right,
   focused app name + apps row in the middle, continue note top right, news below, movies page further down. */
:root{
  --ink:#fbf7f0; --soft:rgba(251,247,240,.72); --faint:rgba(251,247,240,.5);
  --line:rgba(255,255,255,.16); --chip:rgba(255,255,255,.1);
  --glow:#ffd29a; --gunner:#ef3b3f; --nf:#e5484d; --sh:#3ec7b0;
  --ground:#0d0a10;
  --f-ui:"Outfit","Segoe UI",Roboto,Arial,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
.ar{font-family:var(--f-ar)}
/* glow background: two layers crossfade */
.bg{position:fixed;left:0;top:0;width:192px;height:108px;transform:scale(10);transform-origin:0 0;opacity:0;transition:opacity .6s ease;will-change:opacity}
.bg.on{opacity:1}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 30%,rgba(0,0,0,.35) 100%);pointer-events:none}
.page{position:absolute;left:0;top:0;width:1920px;transition:transform .3s cubic-bezier(.2,.7,.2,1);will-change:transform}

/* top */
.top{position:absolute;left:96px;right:96px;top:64px;display:flex;justify-content:space-between;align-items:flex-start}
.clock{font-size:108px;font-weight:200;line-height:.88;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.date{font-size:22px;letter-spacing:.08em;margin-top:14px;color:var(--soft);font-weight:400}
.info{display:flex;gap:12px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-size:19px;font-weight:400;white-space:nowrap}
.chip b{font-weight:600}.chip .g{color:var(--glow)}
.chip svg{width:22px;height:22px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--gunner)}
.chip.match{background:rgba(239,59,63,.18);border-color:rgba(239,59,63,.45)}
.chip.match.soon{background:var(--chip);border-color:var(--line)}
.btns{display:flex;gap:16px}
.ib{height:64px;min-width:64px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--chip);border:1px solid var(--line);
  transition:background .2s,color .2s,padding .2s}
.ib svg{width:28px;height:28px}
.ib em{display:none;font-style:normal;font-size:20px;font-weight:600}
.ib.f{padding:0 24px;background:#fbf7f0;color:#140d10}.ib.f em{display:inline}
.ib.armed{box-shadow:inset 0 0 0 2px var(--glow)}

/* news + fact strip */
.feed{position:absolute;left:96px;right:96px;top:850px;display:flex;gap:24px;align-items:stretch;flex-direction:row-reverse}
.fcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:20px 28px;min-width:0;
  font-family:"IBM Plex Sans Arabic","Noto Kufi Arabic",system-ui,sans-serif}
.fcard.news{flex:1.7}.fcard.fact{flex:1}
.fcard .k{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--faint);margin-bottom:10px}
.fcard .k i{width:8px;height:8px;border-radius:50%;background:var(--nf)}
.fcard.fact .k i{background:#a9cdfa}
.fcard .k .m{margin-inline-start:auto;font-weight:400;font-size:15px}
.fbody{transition:opacity .7s}
.fcard .t{font-size:25px;font-weight:500;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .s{font-size:16px;color:var(--faint);margin-top:6px}

/* movies page (below the home screen) */
.movies{position:absolute;left:96px;right:96px;top:1210px}
.movies .h small{letter-spacing:.04em;font-weight:400;color:var(--faint);font-size:17px;font-family:var(--f-ar)}
.picks{display:flex;gap:28px}
.pk{width:556px;height:340px;border-radius:24px;position:relative;overflow:hidden;flex:none;background:#1a1620 center/cover no-repeat;transition:transform .12s ease-out}
.pk:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,6,10,.94) 32%,rgba(8,6,10,.15) 80%)}
.pk .in{position:absolute;left:30px;top:28px;bottom:26px;width:340px;display:flex;flex-direction:column;z-index:1}
.pk .tag{align-self:flex-start;font-size:15px;font-weight:700;letter-spacing:.1em;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.16)}
.pk .t{text-align:left;font-size:38px;font-weight:700;margin-top:16px;line-height:1.15;font-family:var(--f-ui),var(--f-ar)}
.pk .why{text-align:left;font-family:var(--f-ar);font-size:18px;color:var(--soft);margin-top:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pk .meta{margin-top:auto;font-size:17px;color:var(--soft);display:flex;gap:10px;align-items:center}
.pk.f{transform:scale(1.03);outline:4px solid #fff;outline-offset:-1px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tops{display:flex;gap:28px;margin-top:64px}
.tp{flex:1 1 0;min-width:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:24px 28px}
.tp .hd{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;letter-spacing:.14em;margin-bottom:16px}
.items{display:flex;gap:12px}
.it{flex:1 1 0;min-width:0;display:flex;gap:10px;align-items:center;border-radius:14px;padding:6px;transition:transform .12s}
.it .num{font-size:58px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55);width:30px;flex:none}
.it .ps{width:86px;height:128px;border-radius:12px;flex:none;background:#222 center/cover no-repeat}
.it .n{overflow-wrap:break-word;font-size:19px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.it .g{font-size:15px;color:var(--faint);margin-top:4px}
.it.f{outline:3px solid #fff;transform:scale(1.04)}

/* clean sweep */
.sweep{position:fixed;top:0;bottom:0;left:0;width:520px;pointer-events:none;opacity:0;transform:translateX(-600px);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07) 35%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.07) 65%,transparent);z-index:50}
.sweep.go{animation:sweep 1.1s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes sweep{0%{opacity:1;transform:translateX(-600px)}85%{opacity:1}100%{opacity:0;transform:translateX(2000px)}}

/* sections */
.sec{position:absolute;left:96px;right:0}
.h{font-size:19px;letter-spacing:.18em;color:var(--soft);font-weight:600;margin-bottom:16px}
.name{font-size:60px;font-weight:600;margin-bottom:12px;height:76px;white-space:nowrap}
.row{display:flex;gap:24px;align-items:center;transition:transform .22s cubic-bezier(.2,.7,.2,1);will-change:transform}
.app{width:240px;height:135px;border-radius:18px;flex:none;position:relative;overflow:hidden;background:#222 center/cover no-repeat;
  transition:transform .12s ease-out}
.app .lbl{position:absolute;left:14px;bottom:10px;right:14px;font-size:20px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.app.f{transform:scale(1.1);outline:4px solid #fff;outline-offset:0;z-index:2}
.app.hiddenapp{opacity:.4}
.app.more{background:rgba(255,255,255,.08);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--soft)}
.viewport{overflow:visible;padding:18px 0 18px 18px;margin-left:-18px}

/* sticky note: where you stopped (auto) */
.note{position:absolute;right:96px;top:150px;width:560px;padding:16px 18px 12px;border-radius:22px;background:rgba(18,16,24,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);font-family:var(--f-ar);direction:rtl}
.note .k{font-family:var(--f-ui);font-size:15px;font-weight:700;letter-spacing:.16em;color:var(--soft);margin:0 8px 6px;direction:ltr;text-align:right}
.nt{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 12px;padding-right:24px;border-radius:14px;transition:background .15s;position:relative}
.nt:before{content:"";position:absolute;right:8px;top:10px;bottom:10px;width:5px;border-radius:3px;background:var(--c,#888)}
.nt .n{text-align:right;font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt .e{font-size:16px;color:#fff;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.1);padding:3px 12px;border-radius:99px}
.nt .ap{font-size:13px;color:var(--faint);font-family:var(--f-ui);white-space:nowrap;width:74px;text-align:left;direction:ltr}
.nt .ag{font-size:13px;color:var(--faint);font-family:var(--f-ui);white-space:nowrap;direction:ltr}
.nt.f{background:rgba(255,255,255,.95);color:#140d10}.nt.f .e{color:#140d10;background:rgba(0,0,0,.08)}.nt.f .ap,.nt.f .ag{color:#6b5a50}


/* long-press menu and toast */
.menu{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.menu .box{min-width:520px;background:#16131a;border:1px solid var(--line);border-radius:22px;padding:26px}
.menu h3{font-size:28px;font-weight:600;margin-bottom:16px}
.menu .opt{padding:16px 22px;border-radius:14px;font-size:22px;margin-top:6px;color:var(--soft)}
.menu .opt.f{background:#fbf7f0;color:#140d10;font-weight:600}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(20,16,24,.92);border:1px solid var(--line);padding:16px 28px;border-radius:99px;font-size:21px;z-index:30;transition:opacity .3s}
</style>
</head>

<div class="bg on" id="bgA"></div><div class="bg" id="bgB"></div><div class="shade"></div>

<div class="page" id="page">

      <div class="clock" id="clock">00:00</div>

  <section class="sec" style="top:470px" id="secApps">

<footer class="feed" id="feed">

    <div class="fbody" id="nwR"><div class="t" id="nwT">&nbsp;</div><div class="s" id="nwS"></div></div></article>

    <div class="fbody" id="fcR"><div class="t" id="fcT">&nbsp;</div></div></article>
</footer>

<section class="movies" id="movies">
  <div class="h">WEEKEND PICKS <small id="pkNote">· اختيارات الويكند، تتجدد كل خميس</small></div>
  <div class="picks" id="picks"></div>
  <div class="tops" id="tops"></div>
</section>
</div>

<div class="menu" id="menu" hidden><div class="box"><h3 id="mTitle"></h3><div id="mOpts"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- astronomy: Umm al-Qura prayer times for Riyadh ---------- */
var LAT=24.7136,LNG=46.6753,TZ=3,D2R=Math.PI/180,R2D=180/Math.PI;
function dsin(d){return Math.sin(d*D2R)}function dcos(d){return Math.cos(d*D2R)}
function dtan(d){return Math.tan(d*D2R)}function darcsin(x){return Math.asin(x)*R2D}
function darccos(x){return Math.acos(Math.max(-1,Math.min(1,x)))*R2D}function darctan2(y,x){return Math.atan2(y,x)*R2D}
function fixAngle(a){a=a-360*Math.floor(a/360);return a<0?a+360:a}
function fixHour(h){h=h-24*Math.floor(h/24);return h<0?h+24:h}
function julian(y,m,d){if(m<=2){y-=1;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPosition(jd){var D=jd-2451545.0,g=fixAngle(357.529+0.98560028*D),q=fixAngle(280.459+0.98564736*D),
  L=fixAngle(q+1.915*dsin(g)+0.020*dsin(2*g)),e=23.439-0.00000036*D,
  RA=darctan2(dcos(e)*dsin(L),dcos(L))/15;return{decl:darcsin(dsin(e)*dsin(L)),eqt:q/15-fixHour(RA)}}
function prayerTimes(y,m,d,ramadan){
  var jd=julian(y,m,d)-LNG/(15*24);
  function at(t){return sunPosition(jd+t)}
  function midDay(t){return fixHour(12-at(t).eqt)}
  function angleTime(angle,t,ccw){var p=at(t),noon=midDay(t);
    var a=darccos((-dsin(angle)-dsin(p.decl)*dsin(LAT))/(dcos(p.decl)*dcos(LAT)))/15;return noon+(ccw?-a:a)}
  function asrTime(t){var decl=at(t).decl;return angleTime(-R2D*Math.atan(1/(1+dtan(Math.abs(LAT-decl)))),t)}
  var t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18};
  for(var i=0;i<2;i++){var f={};for(var k in t)f[k]=t[k]/24;
    t={fajr:angleTime(18.5,f.fajr,true),sunrise:angleTime(.833,f.sunrise,true),dhuhr:midDay(f.dhuhr),asr:asrTime(f.asr),maghrib:angleTime(.833,f.maghrib)}}
  var adj=TZ-LNG/15,o={};for(var k2 in t)o[k2]=t[k2]+adj;
  o.isha=o.maghrib+(ramadan?120:90)/60;return o}
function sunAltitude(ms){var dt=new Date(ms),jd=ms/864e5+2440587.5,p=sunPosition(jd);
  var h=dt.getUTCHours()+dt.getUTCMinutes()/60+dt.getUTCSeconds()/3600;
  var H=(h+LNG/15+p.eqt-12)*15;return darcsin(dsin(LAT)*dsin(p.decl)+dcos(LAT)*dcos(p.decl)*dcos(H))}

/* ---------- Riyadh calendar helpers (fixed UTC+3, no DST) ---------- */
var DAY=864e5;
function rParts(ms){var d=new Date(ms+TZ*36e5);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),
  h:d.getUTCHours(),mi:d.getUTCMinutes(),wd:d.getUTCDay()}}
function rMidnight(y,m,d){return Date.UTC(y,m-1,d)-TZ*36e5}          // ms of 00:00 Riyadh
function dayIndex(ms){var p=rParts(ms);return Math.round(Date.UTC(p.y,p.m-1,p.d)/DAY)}
var WD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var MO=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function hm12(h,mi){var ap=h<12?"ص":"م",hh=h%12||12;return{t:hh+":"+(mi<10?"0":"")+mi,ap:ap}}
function fmtHours(x){var m=Math.round(x*60),h=Math.floor(m/60)%24,mi=m%60,r=hm12(h,mi);return r.t+" "+r.ap}

var hijriFmt=null,hijriNum=null;
try{hijriFmt=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{timeZone:"Asia/Riyadh",day:"numeric",month:"long",year:"numeric"});
    hijriNum=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{timeZone:"Asia/Riyadh",day:"numeric",month:"numeric",year:"numeric"})}catch(e){}
function hijriParts(ms){if(!hijriNum)return null;var o={};hijriNum.formatToParts(new Date(ms)).forEach(function(p){o[p.type]=p.value});
  return{y:parseInt(o.year,10),m:parseInt(o.month,10),d:parseInt(o.day,10)}}

/* Arabic counting words */
function nDays(n){return n===1?"يوم":n===2?"يومين":(n>=3&&n<=10)?n+" أيام":n+" يوم"}
function nHours(n){return n===1?"ساعة":n===2?"ساعتين":(n>=3&&n<=10)?n+" ساعات":n+" ساعة"}
function nMins(n){return n===1?"دقيقة":n===2?"دقيقتين":(n>=3&&n<=10)?n+" دقائق":n+" دقيقة"}
function untilText(ms){var m=Math.max(0,Math.ceil(ms/6e4)),h=Math.floor(m/60),mi=m%60;
  if(m<=1)return"الآن";if(h===0)return"بعد "+nMins(mi);if(mi===0)return"بعد "+nHours(h);return"بعد "+nHours(h)+" و"+nMins(mi)}



/* ---------- platform bridge (window.Tv from the Android app; sample data in a desktop browser) ---------- */
var HAS_TV=typeof window.Tv!=="undefined";
function tvCall(name){try{if(HAS_TV&&Tv[name])return Tv[name].apply(Tv,[].slice.call(arguments,1))}catch(e){}return null}

 .map(function(a){return{pkg:a[0],label:a[1],color:a[2],banner:""}});

    var p=SFX[kind],t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type="sine";o.frequency.setValueAtTime(p[0],t);o.frequency.exponentialRampToValueAtTime(p[1],t+p[2]);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(p[3],t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]+0.03);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+p[2]+0.05)}catch(e){}}

function cleanUp(){

  else toast(mb>=50?"All apps closed · "+size+" freed":"All apps closed")};

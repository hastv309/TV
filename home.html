<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>TV Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Layout: 1920x1080 TV canvas. Clock block top-left, icon buttons top-right,
   focused app name + apps row in the middle, continue watching below, trends further down (scrolls into view). */
:root{
  --ink:#fbf7f0; --soft:rgba(251,247,240,.72); --faint:rgba(251,247,240,.5);
  --line:rgba(255,255,255,.16); --chip:rgba(255,255,255,.1);
  --glow:#ffd29a; --gunner:#ef3b3f; --nf:#e5484d; --sh:#3ec7b0;
  --ground:#0d0a10;
  --f-ui:"Outfit","Segoe UI",Roboto,Arial,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
.ar{font-family:var(--f-ar)}
/* glow background: two layers crossfade */
.bg{position:fixed;left:0;top:0;width:192px;height:108px;transform:scale(10);transform-origin:0 0;opacity:0;transition:opacity .6s ease;will-change:opacity}
.bg.on{opacity:1}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 30%,rgba(0,0,0,.35) 100%);pointer-events:none}
.page{position:absolute;left:0;top:0;width:1920px;transition:transform .3s cubic-bezier(.2,.7,.2,1);will-change:transform}

/* top */
.top{position:absolute;left:96px;right:96px;top:64px;display:flex;justify-content:space-between;align-items:flex-start}
.clock{font-size:108px;font-weight:200;line-height:.88;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.date{font-size:22px;letter-spacing:.08em;margin-top:14px;color:var(--soft);font-weight:400}
.info{display:flex;gap:12px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-size:19px;font-weight:400;white-space:nowrap}
.chip b{font-weight:600}.chip .g{color:var(--glow)}
.chip svg{width:22px;height:22px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--gunner)}
.chip.match{background:rgba(239,59,63,.18);border-color:rgba(239,59,63,.45)}
.btns{display:flex;gap:16px}
.ib{height:64px;min-width:64px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--chip);border:1px solid var(--line);
  transition:background .2s,color .2s,padding .2s}
.ib svg{width:28px;height:28px}
.ib em{display:none;font-style:normal;font-size:20px;font-weight:600}
.ib.f{padding:0 24px;background:#fbf7f0;color:#140d10}.ib.f em{display:inline}
.ib.armed{box-shadow:inset 0 0 0 2px var(--glow)}

/* sections */
.sec{position:absolute;left:96px;right:0}
.h{font-size:19px;letter-spacing:.18em;color:var(--soft);font-weight:600;margin-bottom:16px}
.name{font-size:60px;font-weight:600;margin-bottom:12px;height:76px;white-space:nowrap}
.row{display:flex;gap:24px;align-items:center;transition:transform .22s cubic-bezier(.2,.7,.2,1);will-change:transform}
.app{width:240px;height:135px;border-radius:18px;flex:none;position:relative;overflow:hidden;background:#222 center/cover no-repeat;
  transition:transform .12s ease-out}
.app .lbl{position:absolute;left:14px;bottom:10px;right:14px;font-size:20px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.app.f{transform:scale(1.1);outline:4px solid #fff;outline-offset:0;z-index:2}
.app.hiddenapp{opacity:.4}
.app.more{background:rgba(255,255,255,.08);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--soft)}
.viewport{overflow:visible;padding:18px 0 18px 18px;margin-left:-18px}

/* continue watching */
.cw{display:flex;gap:22px}
.ep{width:340px;flex:none;transition:transform .12s ease-out}
.ep .th{height:191px;border-radius:14px;position:relative;overflow:hidden;background:#1b1b22 center/cover no-repeat}
.ep .th::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,0) 55%)}
.ep .bar{position:absolute;left:14px;right:14px;bottom:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.ep .bar span{display:block;height:100%;border-radius:3px;background:#fff}
.ep .tag{position:absolute;top:12px;left:12px;font-size:14px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.6)}
.ep .t{margin-top:12px;font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .s{font-size:16px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep.f{transform:scale(1.06)}.ep.f .th{outline:4px solid #fff}
.ep.recent{width:300px}.ep.recent .th{height:169px;background-size:cover}.ep.recent .th::before{display:none}

/* trends */
.trends{display:flex;gap:22px}
.tr{width:440px;background:rgba(8,12,20,.45);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px 22px;transition:box-shadow .2s}
.tr.f{box-shadow:0 0 0 3px #fff}
.tr .hd{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.14em}
.tr .hd i{width:11px;height:11px;border-radius:50%}.tr .hd small{margin-left:auto;font-weight:500;color:var(--faint);letter-spacing:.06em;font-size:15px}
.tr .one{display:flex;align-items:center;gap:14px;margin:8px 0}
.tr .one span{font-size:52px;font-weight:200;color:var(--glow);line-height:.9}
.tr .one em{display:block;font-style:normal;font-size:12px;letter-spacing:.14em;color:var(--glow)}
.tr .one b{font-size:26px;font-weight:600}
.tr ol{list-style:none;border-top:1px solid rgba(255,255,255,.14);padding-top:8px;display:flex;flex-direction:column;gap:5px;font-size:19px;color:var(--soft)}
.tr ol li em{font-style:normal;color:var(--glow);display:inline-block;width:1.4em}

/* long-press menu and toast */
.menu{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.menu .box{min-width:520px;background:#16131a;border:1px solid var(--line);border-radius:22px;padding:26px}
.menu h3{font-size:28px;font-weight:600;margin-bottom:16px}
.menu .opt{padding:16px 22px;border-radius:14px;font-size:22px;margin-top:6px;color:var(--soft)}
.menu .opt.f{background:#fbf7f0;color:#140d10;font-weight:600}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(20,16,24,.92);border:1px solid var(--line);padding:16px 28px;border-radius:99px;font-size:21px;z-index:30;transition:opacity .3s}
</style>
</head>
<body>
<div class="bg on" id="bgA"></div><div class="bg" id="bgB"></div><div class="shade"></div>

<div class="page" id="page">
  <header class="top">
    <div>
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date">SUNDAY 25 OCTOBER · 14 JUMADA I 1448 AH</div>
      <div class="info">
        <span class="chip" id="cPrayer"><b class="g" id="pName">Asr</b><span id="pWhen">2:53 PM</span></span>
        <span class="chip" id="cWx" hidden><span id="wxI"></span><b id="wxT">31°</b><span id="wxC">Clear</span></span>
        <span class="chip match" id="cMatch" hidden><i class="dot"></i><span id="mText">Liverpool vs Arsenal · 19:30</span></span>
      </div>
    </div>
    <nav class="btns" id="btns"></nav>
  </header>

  <section class="sec" style="top:330px">
    <div class="name" id="appName">&nbsp;</div>
    <div class="viewport"><div class="row" id="apps"></div></div>
  </section>

  <section class="sec" style="top:640px" id="secCW">
    <div class="h" id="cwTitle">CONTINUE WATCHING</div>
    <div class="viewport"><div class="cw row" id="cw"></div></div>
  </section>

  <section class="sec" style="top:1010px" id="secTr">
    <div class="h">TRENDING THIS WEEK</div>
    <div class="trends" id="trends"></div>
  </section>
</div>

<div class="menu" id="menu" hidden><div class="box"><h3 id="mTitle"></h3><div id="mOpts"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- astronomy: Umm al-Qura prayer times for Riyadh ---------- */
var LAT=24.7136,LNG=46.6753,TZ=3,D2R=Math.PI/180,R2D=180/Math.PI;
function dsin(d){return Math.sin(d*D2R)}function dcos(d){return Math.cos(d*D2R)}
function dtan(d){return Math.tan(d*D2R)}function darcsin(x){return Math.asin(x)*R2D}
function darccos(x){return Math.acos(Math.max(-1,Math.min(1,x)))*R2D}function darctan2(y,x){return Math.atan2(y,x)*R2D}
function fixAngle(a){a=a-360*Math.floor(a/360);return a<0?a+360:a}
function fixHour(h){h=h-24*Math.floor(h/24);return h<0?h+24:h}
function julian(y,m,d){if(m<=2){y-=1;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPosition(jd){var D=jd-2451545.0,g=fixAngle(357.529+0.98560028*D),q=fixAngle(280.459+0.98564736*D),
  L=fixAngle(q+1.915*dsin(g)+0.020*dsin(2*g)),e=23.439-0.00000036*D,
  RA=darctan2(dcos(e)*dsin(L),dcos(L))/15;return{decl:darcsin(dsin(e)*dsin(L)),eqt:q/15-fixHour(RA)}}
function prayerTimes(y,m,d,ramadan){
  var jd=julian(y,m,d)-LNG/(15*24);
  function at(t){return sunPosition(jd+t)}
  function midDay(t){return fixHour(12-at(t).eqt)}
  function angleTime(angle,t,ccw){var p=at(t),noon=midDay(t);
    var a=darccos((-dsin(angle)-dsin(p.decl)*dsin(LAT))/(dcos(p.decl)*dcos(LAT)))/15;return noon+(ccw?-a:a)}
  function asrTime(t){var decl=at(t).decl;return angleTime(-R2D*Math.atan(1/(1+dtan(Math.abs(LAT-decl)))),t)}
  var t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18};
  for(var i=0;i<2;i++){var f={};for(var k in t)f[k]=t[k]/24;
    t={fajr:angleTime(18.5,f.fajr,true),sunrise:angleTime(.833,f.sunrise,true),dhuhr:midDay(f.dhuhr),asr:asrTime(f.asr),maghrib:angleTime(.833,f.maghrib)}}
  var adj=TZ-LNG/15,o={};for(var k2 in t)o[k2]=t[k2]+adj;
  o.isha=o.maghrib+(ramadan?120:90)/60;return o}
function sunAltitude(ms){var dt=new Date(ms),jd=ms/864e5+2440587.5,p=sunPosition(jd);
  var h=dt.getUTCHours()+dt.getUTCMinutes()/60+dt.getUTCSeconds()/3600;
  var H=(h+LNG/15+p.eqt-12)*15;return darcsin(dsin(LAT)*dsin(p.decl)+dcos(LAT)*dcos(p.decl)*dcos(H))}

/* ---------- Riyadh calendar helpers (fixed UTC+3, no DST) ---------- */
var DAY=864e5;
function rParts(ms){var d=new Date(ms+TZ*36e5);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),
  h:d.getUTCHours(),mi:d.getUTCMinutes(),wd:d.getUTCDay()}}
function rMidnight(y,m,d){return Date.UTC(y,m-1,d)-TZ*36e5}          // ms of 00:00 Riyadh
function dayIndex(ms){var p=rParts(ms);return Math.round(Date.UTC(p.y,p.m-1,p.d)/DAY)}
var WD=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var MO=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function hm12(h,mi){var ap=h<12?"ص":"م",hh=h%12||12;return{t:hh+":"+(mi<10?"0":"")+mi,ap:ap}}
function fmtHours(x){var m=Math.round(x*60),h=Math.floor(m/60)%24,mi=m%60,r=hm12(h,mi);return r.t+" "+r.ap}

var hijriFmt=null,hijriNum=null;
try{hijriFmt=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{timeZone:"Asia/Riyadh",day:"numeric",month:"long",year:"numeric"});
    hijriNum=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{timeZone:"Asia/Riyadh",day:"numeric",month:"numeric",year:"numeric"})}catch(e){}
function hijriParts(ms){if(!hijriNum)return null;var o={};hijriNum.formatToParts(new Date(ms)).forEach(function(p){o[p.type]=p.value});
  return{y:parseInt(o.year,10),m:parseInt(o.month,10),d:parseInt(o.day,10)}}

/* Arabic counting words */
function nDays(n){return n===1?"يوم":n===2?"يومين":(n>=3&&n<=10)?n+" أيام":n+" يوم"}
function nHours(n){return n===1?"ساعة":n===2?"ساعتين":(n>=3&&n<=10)?n+" ساعات":n+" ساعة"}
function nMins(n){return n===1?"دقيقة":n===2?"دقيقتين":(n>=3&&n<=10)?n+" دقائق":n+" دقيقة"}
function untilText(ms){var m=Math.max(0,Math.ceil(ms/6e4)),h=Math.floor(m/60),mi=m%60;
  if(m<=1)return"الآن";if(h===0)return"بعد "+nMins(mi);if(mi===0)return"بعد "+nHours(h);return"بعد "+nHours(h)+" و"+nMins(mi)}



/* ---------- platform bridge (window.Tv from the Android app; sample data in a desktop browser) ---------- */
var HAS_TV=typeof window.Tv!=="undefined";
function tvCall(name){try{if(HAS_TV&&Tv[name])return Tv[name].apply(Tv,[].slice.call(arguments,1))}catch(e){}return null}
var SAMPLE_APPS=[["com.netflix.ninja","Netflix","#b1121c"],["net.mbc.shahidTV","Shahid","#1d9d8b"],["com.google.android.youtube.tv","YouTube","#d4302a"],
 ["com.thmanyah.shasha.tv","Thmanyah","#3b2a6e"],["com.mbm_soft.aroma4kitv","Aroma","#2b3540"],["com.mbm_soft.lionmax","LionMax","#7a5b18"]]
 .map(function(a){return{pkg:a[0],label:a[1],color:a[2],banner:""}});
function getApps(){var j=tvCall("apps");if(j){try{return JSON.parse(j)}catch(e){}}return HAS_TV?[]:SAMPLE_APPS}
function getWatchNext(){var j=tvCall("watchNext");if(j){try{return JSON.parse(j)}catch(e){}}
  if(HAS_TV)return{ok:false,items:[]};
  return{ok:true,items:[{title:"Lupin",sub:"Part 4 · E2",pkg:"com.netflix.ninja",img:"",progress:.35,left:34},
    {title:"طالع نازل",sub:"S1 · E6",pkg:"net.mbc.shahidTV",img:"",progress:.62,left:21}]}}

/* ---------- storage helpers (order, hidden apps, recents) ---------- */
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- icons ---------- */
function svg(p,extra){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"'+(extra||"")+'>'+p+'</svg>'}
var ICONS={
 screensaver:'<rect x="3" y="5" width="18" height="13" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/>',
 sleep:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><path d="M15 3h4l-4 4h4"/>',
 wifi:'<path d="M2.5 9a14 14 0 0 1 19 0"/><path d="M5.5 12.5a9.5 9.5 0 0 1 13 0"/><path d="M8.7 16a5 5 0 0 1 6.6 0"/><circle cx="12" cy="19.3" r="1.2" fill="currentColor"/>',
 settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
 sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
 moon:'<path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/>',
 cloud:'<path d="M7.5 19h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.2A3.4 3.4 0 0 0 7.5 19z"/>',
 rain:'<path d="M7.5 16h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.6 1.2A3.4 3.4 0 0 0 7.5 16z"/><path d="M9 19.5l-1 2M13 19.5l-1 2M17 19.5l-1 2"/>'};

/* ---------- buttons ---------- */
var BTNS=[{id:"screensaver",label:"Screensaver"},{id:"sleep",label:"Sleep"},{id:"wifi",label:"Wi-Fi"},{id:"settings",label:"Settings"}];
var sleepAt=0;
function renderBtns(){var n=$("btns");n.innerHTML="";
  BTNS.forEach(function(b){var s=document.createElement("span");s.className="ib";s.innerHTML=svg(ICONS[b.id])+"<em></em>";
    s.querySelector("em").textContent=b.id==="sleep"&&sleepAt?("Sleep in "+Math.max(1,Math.round((sleepAt-Date.now())/6e4))+" min"):b.label;
    if(b.id==="sleep"&&sleepAt)s.classList.add("armed");n.appendChild(s)})}
function doBtn(id){
  if(id==="settings")tvCall("openSettings");
  else if(id==="wifi")tvCall("openWifi");
  else if(id==="screensaver"){if(tvCall("screensaver")===false)toast("Screensaver is not available")}
  else if(id==="sleep")openMenu("Sleep timer",[["Turn off now",function(){sleepIn(-1)}],["In 30 minutes",function(){sleepIn(30)}],["In 60 minutes",function(){sleepIn(60)}],
    ["In 90 minutes",function(){sleepIn(90)}],["Cancel timer",function(){sleepIn(0)}]])}
function sleepIn(min){
  var r=tvCall("sleepIn",min);
  if(HAS_TV&&r===false){toast("Sleep needs a one-time setup command");return}
  sleepAt=min>0?Date.now()+min*6e4:0;renderBtns();paintFocus();
  toast(min>0?"The TV will turn off in "+min+" minutes":min===0?"Sleep timer cancelled":"Turning off")}

/* ---------- apps row ---------- */
var apps=[],shownApps=[],showHidden=false;
function orderedApps(){
  var order=load("order",[]),hidden=load("hidden",[]),all=getApps(),self="com.hussam.tvhome";
  all=all.filter(function(a){return a.pkg!==self});
  /* saved order first; otherwise the usual favourites lead, then everything else A-Z */
  var pref=["com.netflix.ninja","net.mbc.shahidTV","com.google.android.youtube.tv","com.thmanyah.shasha.tv"];
  function rank(p){var i=order.indexOf(p);if(i>=0)return i;var j=pref.indexOf(p);return j>=0?500+j:999}
  all.sort(function(a,b){return rank(a.pkg)-rank(b.pkg)||a.label.localeCompare(b.label)});
  apps=all;
  shownApps=all.filter(function(a){return showHidden||hidden.indexOf(a.pkg)<0});
  return hidden}
function renderApps(){
  var hidden=orderedApps(),row=$("apps");row.innerHTML="";
  shownApps.forEach(function(a){var d=document.createElement("div");d.className="app"+(hidden.indexOf(a.pkg)>=0?" hiddenapp":"");
    if(a.banner)d.style.backgroundImage='url("'+a.banner+'")';else{d.style.background=a.color||"#333";var l=document.createElement("span");l.className="lbl";l.textContent=a.label;d.appendChild(l)}
    row.appendChild(d)});
  if(hidden.length){var m=document.createElement("div");m.className="app more";m.textContent=showHidden?"Done":"Hidden apps ("+hidden.length+")";row.appendChild(m)}
}
function appCount(){return $("apps").children.length}
function launchApp(i){
  if(i>=shownApps.length){showHidden=!showHidden;renderApps();focus.col=0;paintFocus();return}
  var a=shownApps[i];rememberOpen(a.pkg);
  if(tvCall("launch",a.pkg)===false)toast("Could not open "+a.label)}
/* recently opened apps, newest first: [{p:package,t:time}] */
function recents(){return load("recent",[]).map(function(x){return typeof x==="string"?{p:x,t:0}:x})}
function rememberOpen(pkg){var r=recents().filter(function(x){return x.p!==pkg});r.unshift({p:pkg,t:Date.now()});save("recent",r.slice(0,8))}
function ago(t){if(!t)return"";var m=Math.round((Date.now()-t)/6e4);if(m<2)return"Just now";if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<24)return h+(h===1?" hour ago":" hours ago");var d=Math.round(h/24);return d===1?"Yesterday":d+" days ago"}
function moveApp(i,dir){
  var pk=shownApps[i].pkg,ord=apps.map(function(a){return a.pkg}),k=ord.indexOf(pk),t=k+dir;
  if(t<0||t>=ord.length)return;ord.splice(k,1);ord.splice(t,0,pk);save("order",ord);renderApps();focus.col=Math.max(0,Math.min(i+dir,shownApps.length-1));paintFocus()}
function toggleHide(i){var pk=shownApps[i].pkg,h=load("hidden",[]),k=h.indexOf(pk);if(k<0)h.push(pk);else h.splice(k,1);save("hidden",h);renderApps();
  focus.col=Math.min(focus.col,appCount()-1);paintFocus()}

/* ---------- continue watching (falls back to recently opened apps) ---------- */
var cwItems=[],cwMode="watch";
function renderCW(){
  var wn=getWatchNext(),box=$("cw");box.innerHTML="";cwItems=[];
  if(wn&&wn.ok&&wn.items&&wn.items.length){cwMode="watch";cwItems=wn.items.slice(0,10);$("cwTitle").textContent="CONTINUE WATCHING"}
  else{cwMode="recent";$("cwTitle").textContent="JUMP BACK IN";
    recents().slice(0,5).forEach(function(x){var a=apps.filter(function(y){return y.pkg===x.p})[0];if(a)cwItems.push({title:a.label,sub:ago(x.t)||"Continue where you left off",pkg:a.pkg,img:a.banner,app:a})})}
  $("secCW").hidden=!cwItems.length;
  cwItems.forEach(function(it){
    var a=apps.filter(function(x){return x.pkg===it.pkg})[0];
    var e=document.createElement("div");e.className="ep"+(cwMode==="recent"?" recent":"");
    var th=document.createElement("div");th.className="th";if(it.img)th.style.backgroundImage='url("'+it.img+'")';else th.style.background="linear-gradient(135deg,"+((a&&a.color)||"#333")+",#111)";
    if(cwMode==="watch"){var tg=document.createElement("span");tg.className="tag";tg.textContent=((a&&a.label)||"").toUpperCase();th.appendChild(tg);
      if(it.progress>0){var b=document.createElement("div");b.className="bar";b.innerHTML="<span></span>";b.firstChild.style.width=Math.round(Math.min(1,it.progress)*100)+"%";th.appendChild(b)}}
    var t=document.createElement("div");t.className="t";t.textContent=it.title;if(/[؀-ۿ]/.test(it.title))t.classList.add("ar");
    var s=document.createElement("div");s.className="s";s.textContent=(it.sub||"")+(it.left?" · "+it.left+" min left":"");if(cwMode==="recent")s.textContent=it.sub;
    e.appendChild(th);e.appendChild(t);e.appendChild(s);box.appendChild(e)})}
function openCW(i){var it=cwItems[i];if(!it)return;
  if(cwMode==="watch"){if(tvCall("openWatchNext",i)===false)tvCall("launch",it.pkg)}else{rememberOpen(it.pkg);if(tvCall("launch",it.pkg)===false)toast("Could not open "+it.title)}}

/* ---------- trends from data.json ---------- */
var DATA={trends:{nf:[],sh:[]},fixtures:[]};
function renderTrends(){
  var box=$("trends");box.innerHTML="";
  [["nf","NETFLIX","TOP 5 · KSA","var(--nf)"],["sh","SHAHID","TOP 5","var(--sh)"]].forEach(function(p){
    var l=DATA.trends[p[0]]||[];if(!l.length)return;
    var c=document.createElement("div");c.className="tr";
    c.innerHTML='<div class="hd"><i></i><span></span><small></small></div><div class="one"><span>1</span><div><em>#1 THIS WEEK</em><b></b></div></div><ol></ol>';
    c.querySelector(".hd i").style.background=p[3];c.querySelector(".hd span").textContent=p[1];c.querySelector(".hd small").textContent=p[2];
    c.querySelector(".one b").textContent=l[0];var ol=c.querySelector("ol");
    l.slice(1,5).forEach(function(t,i){var li=document.createElement("li"),em=document.createElement("em");em.textContent=i+2;li.appendChild(em);li.appendChild(document.createTextNode(t));ol.appendChild(li)});
    box.appendChild(c)});
  $("secTr").hidden=!box.children.length}
function loadData(){
  var base=/^https?:/.test(location.protocol)?"":"https://hastv309.github.io/TV/";
  fetch(base+"data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DATA=d;renderTrends();renderInfo();paintFocus()}).catch(function(){})}

/* ---------- clock, prayer, weather, match ---------- */
var EN_WD=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
var EN_MO=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
var HJ=["MUHARRAM","SAFAR","RABI I","RABI II","JUMADA I","JUMADA II","RAJAB","SHA'BAN","RAMADAN","SHAWWAL","DHU AL-QADAH","DHU AL-HIJJAH"];
var PN={fajr:"Fajr",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha"};
function hhmm(h,m){return(h<10?"0":"")+h+":"+(m<10?"0":"")+m}
function ampm(h,m){return(h%12||12)+":"+(m<10?"0":"")+m+(h<12?" AM":" PM")}
function inMin(ms){var m=Math.max(0,Math.ceil(ms/6e4)),h=Math.floor(m/60);return h?("in "+h+" h "+(m%60)+" min"):("in "+m+" min")}
function nextPrayer(now){
  for(var d=0;d<2;d++){var day=now+d*DAY,p=rParts(day),h=hijriParts(day),t=prayerTimes(p.y,p.m,p.d,!!(h&&h.m===9)),base=rMidnight(p.y,p.m,p.d);
    var ks=["fajr","dhuhr","asr","maghrib","isha"];
    for(var i=0;i<ks.length;i++){var at=base+Math.round(t[ks[i]]*60)*6e4;if(at>now){var name=(ks[i]==="dhuhr"&&p.wd===5)?"Jumu'ah":PN[ks[i]];var hm=rParts(at);return{name:name,at:at,h:hm.h,m:hm.mi}}}}}
function renderInfo(){
  var now=Date.now(),p=rParts(now),h=hijriParts(now);
  $("clock").textContent=hhmm(p.h,p.mi);
  $("date").textContent=EN_WD[p.wd]+" "+p.d+" "+EN_MO[p.m-1]+(h?" · "+h.d+" "+HJ[h.m-1]+" "+h.y+" AH":"");
  var np=nextPrayer(now);if(np){$("pName").textContent=np.name;$("pWhen").textContent=ampm(np.h,np.m)+" · "+inMin(np.at-now)}
  /* match chip: only on match day (Riyadh date) */
  var mt=null;(DATA.fixtures||[]).forEach(function(f){var at=Date.parse(f[0]);if(!mt&&at+2*36e5>now&&dayIndex(at)===dayIndex(now))mt={at:at,home:f[2],away:f[3],cl:f[1]==="CL"}});
  if(mt){var k=rParts(mt.at);$("mText").textContent=(now>=mt.at?"LIVE · ":"Matchday · ")+mt.home+" vs "+mt.away+" · "+hhmm(k.h,k.mi);$("cMatch").hidden=false}else $("cMatch").hidden=true}
function wxIcon(c,day){if(c===0||c===1)return svg(day?ICONS.sun:ICONS.moon,' style="color:var(--glow)"');if(c>=51&&c<=82||c>=95)return svg(ICONS.rain);return svg(ICONS.cloud)}
function wxText(c){if(c===0)return"Clear";if(c<=2)return"Partly cloudy";if(c===3)return"Cloudy";if(c===45||c===48)return"Fog";if(c>=51&&c<=67)return"Rain";if(c>=80&&c<=82)return"Showers";if(c>=95)return"Storm";return""}
function loadWeather(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LNG+"&current=temperature_2m,weather_code,is_day&timezone=Asia%2FRiyadh")
  .then(function(r){return r.json()}).then(function(j){if(!j.current)return;var c=j.current.weather_code;
    $("wxT").textContent=Math.round(j.current.temperature_2m)+"°";$("wxC").textContent=wxText(c);$("wxI").innerHTML=wxIcon(c,j.current.is_day!==0);$("cWx").hidden=false}).catch(function(){})}

/* ---------- glow background ---------- */
var bgOn="A",bgColor="";
function setGlow(hex){
  if(!hex||hex===bgColor)return;bgColor=hex;
  var nxt=bgOn==="A"?"B":"A",el=$("bg"+nxt);
  el.style.background="radial-gradient(ellipse 62% 75% at 28% 34%,"+hex+" 0%,"+shade(hex,.45)+" 38%,#0d0a10 74%)";/* drawn at 192x108, scaled x10 */
  el.classList.add("on");$("bg"+bgOn).classList.remove("on");bgOn=nxt}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=(n>>16)*f|0,g=(n>>8&255)*f|0,b=(n&255)*f|0;return"rgb("+r+","+g+","+b+")"}

/* ---------- focus and remote control ---------- */
/* rows: 0 buttons, 1 apps, 2 continue watching, 3 trends */
var focus={row:1,col:0},menuState=null,glowT=null,lastMove=0;
function rowLen(r){if(r===0)return BTNS.length;if(r===1)return appCount();if(r===2)return $("secCW").hidden?0:cwItems.length;if(r===3)return $("secTr").hidden?0:$("trends").children.length;return 0}
function paintFocus(){
  document.querySelectorAll(".f").forEach(function(e){if(!e.closest(".menu"))e.classList.remove("f")});
  var r=focus.row,c=focus.col,el=null;
  if(r===0)el=$("btns").children[c];if(r===1)el=$("apps").children[c];if(r===2)el=$("cw").children[c];if(r===3)el=$("trends").children[c];
  if(el)el.classList.add("f");
  /* name + glow follow the focused app / item */
  var a=null;if(r===1)a=shownApps[c];if(r===2&&cwItems[c])a=apps.filter(function(x){return x.pkg===cwItems[c].pkg})[0];
  $("appName").textContent=r===1?(a?a.label:(c>=shownApps.length?(showHidden?"Done":"Hidden apps"):"")):($("appName").textContent);
  if(a&&a.color){clearTimeout(glowT);var col=a.color;glowT=setTimeout(function(){setGlow(col)},180)}
  /* horizontal scroll of the focused row */
  [["apps",1,264],["cw",2,362]].forEach(function(x){var row=$(x[0]),shift=0;if(focus.row===x[1]){var vis=Math.floor((1728)/x[2]);shift=Math.max(0,focus.col-vis+2)*x[2]}else return;row.style.transform="translateX("+(-shift)+"px)"});
  /* vertical scroll: bring trends into view */
  $("page").style.transform=focus.row===3?"translateY(-430px)":"translateY(0)"}
function moveFocus(dr,dc){
  if(dr){var r=focus.row;do{r+=dr}while(r>=0&&r<=3&&!rowLen(r));if(r<0||r>3)return;focus.row=r;focus.col=Math.min(focus.col,rowLen(r)-1)}
  else{focus.col=Math.max(0,Math.min(rowLen(focus.row)-1,focus.col+dc))}
  paintFocus()}
function activate(long){
  var r=focus.row,c=focus.col;
  if(r===0){if(long&&BTNS[c].id==="settings"){openMenu("Home screen",[[SOUND?"Turn sounds off":"Turn sounds on",function(){SOUND=!SOUND;save("sound",SOUND);toast(SOUND?"Sounds on":"Sounds off")}]]);return}doBtn(BTNS[c].id)}
  else if(r===1){if(long&&c<shownApps.length){var a=shownApps[c],hid=load("hidden",[]).indexOf(a.pkg)>=0;
      openMenu(a.label,[["Move left",function(){moveApp(c,-1)}],["Move right",function(){moveApp(c,1)}],[hid?"Show on home":"Hide from home",function(){toggleHide(c)}]])}
    else launchApp(c)}
  else if(r===2)openCW(c)}
function openMenu(title,opts){menuState={opts:opts,i:0};$("mTitle").textContent=title;var b=$("mOpts");b.innerHTML="";
  opts.forEach(function(o,i){var d=document.createElement("div");d.className="opt"+(i?"":" f");d.textContent=o[0];b.appendChild(d)});$("menu").hidden=false}
function closeMenu(){menuState=null;$("menu").hidden=true}
function menuKey(k){var n=menuState.opts.length;
  if(k==="up")menuState.i=(menuState.i+n-1)%n;else if(k==="down")menuState.i=(menuState.i+1)%n;
  else if(k==="ok"){var f=menuState.opts[menuState.i][1];closeMenu();f();return}else if(k==="back"){closeMenu();return}
  [].forEach.call($("mOpts").children,function(e,i){e.classList.toggle("f",i===menuState.i)})}
var okDown=0,okTimer=null,okLong=false;
document.addEventListener("keydown",function(e){
  var k={37:"left",38:"up",39:"right",40:"down",13:"ok",23:"ok",66:"ok",4:"back",27:"back",8:"back"}[e.keyCode];if(!k)return;e.preventDefault();
  if(k==="ok"){if(e.repeat||okDown)return;okDown=Date.now();okLong=false;
    okTimer=setTimeout(function(){okLong=true;if(menuState)return;sfx("ok");activate(true)},650);return}
  if(menuState){sfx(k==="back"?"back":"move");menuKey(k);return}
  var t=Date.now();if(e.repeat&&t-lastMove<90)return;lastMove=t;
  if(k==="back"){sfx("back");goHome();return}
  var before=focus.row+":"+focus.col;
  if(k==="left")moveFocus(0,-1);else if(k==="right")moveFocus(0,1);else if(k==="up")moveFocus(-1,0);else if(k==="down")moveFocus(1,0);
  sfx(before===focus.row+":"+focus.col?"edge":"move")});
document.addEventListener("keyup",function(e){
  var k={13:"ok",23:"ok",66:"ok"}[e.keyCode];if(!k||!okDown)return;e.preventDefault();clearTimeout(okTimer);okDown=0;
  if(okLong)return;sfx("ok");if(menuState){menuKey("ok");return}activate(false)});
function goHome(){if(menuState){closeMenu();return}focus={row:1,col:0};paintFocus()}
/* called by the Android app */
window.onHome=goHome;window.onBack=function(){if(menuState)closeMenu();else goHome()};
window.onResumeHome=function(){renderApps();renderCW();paintFocus();renderInfo()};
window.onSleepCancelled=function(){sleepAt=0;renderBtns();paintFocus()};

/* ---------- interface sounds: short soft clicks made with Web Audio ---------- */
var actx=null,SOUND=load("sound",true);
var SFX={move:[1250,900,.022,.05],ok:[700,420,.06,.08],back:[520,330,.05,.06],edge:[240,200,.035,.05]};
function sfx(kind){
  if(!SOUND)return;
  try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
    var p=SFX[kind],t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type="sine";o.frequency.setValueAtTime(p[0],t);o.frequency.exponentialRampToValueAtTime(p[1],t+p[2]);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(p[3],t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]+0.03);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+p[2]+0.05)}catch(e){}}
var toastT=null;function toast(t){var e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},3200)}
var $=function(id){return document.getElementById(id)};

/* ---------- start ---------- */
renderBtns();renderApps();renderCW();renderTrends();renderInfo();paintFocus();
if(!bgColor)setGlow("#5a1a2a");
loadData();loadWeather();
setInterval(function(){renderInfo();if(sleepAt){renderBtns();paintFocus()}},10000);
setInterval(loadWeather,30*60000);setInterval(loadData,60*60000);
setInterval(function(){if(!menuState)renderCW()},5*60000);
</script>
